[project]
name = "elysium-master-application"
version = "1.0.12"
description = "Elysium Cards and Games Master Application"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
    "requests>=2.31",
    "pymongo>=4.7",
    "python-dotenv>=1.0",
    "keyring>=24.0",
    "argon2-cffi>=23.1",
    "anthropic>=0.116",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
]
build = [
    "pyinstaller>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
